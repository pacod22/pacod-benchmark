[package]
name = "pacod-bench"
description = "pacod-benchmark's service: the API the UI calls, the run queue, the database; and the command line that runs a suite without them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pacod_bench"
path = "src/lib.rs"

[[bin]]
name = "pacod-bench"
path = "src/main.rs"

[dependencies]
pacod-bench-engine.workspace = true
pacod-gw-bench-report.workspace = true
pacod-gw-load.workspace = true
pacod-gw-logging.workspace = true
pacod-id-authz.workspace = true
pacod-id-client.workspace = true

anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
mimalloc.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
pacod-bench-engine = { workspace = true, features = ["testing"] }
pacod-id-authz = { workspace = true, features = ["vectors"] }
pacod-gw-testkit.workspace = true
